name: Recipe – agent-memory-eval
# Heavier end-to-end recipe (~1.3 GB of models). Runs only when the recipe changes, weekly, or on demand.
# Not a required check.
on:
  push:
    branches: [main]
    paths: ['recipes/agent-memory-eval/**', '.github/workflows/recipe-agent-memory.yml']
  pull_request:
    paths: ['recipes/agent-memory-eval/**', '.github/workflows/recipe-agent-memory.yml']
  schedule: [{cron: '0 4 * * 1'}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22'}
      - run: pip install -r recipes/agent-memory-eval/requirements.txt
      - run: ./recipes/agent-memory-eval/smoke.sh
