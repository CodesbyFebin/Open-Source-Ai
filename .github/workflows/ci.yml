name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  catalog:
    name: Catalog integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Schema, duplicates, licences, evidence, no submodules
        run: python scripts/validate.py
      - name: Unit tests (collector, validator, build)
        run: python -m pytest -q tests
      - name: Generated files match catalog (and generation is deterministic)
        run: |
          python scripts/build.py && git diff --exit-code
          python scripts/build.py && git diff --exit-code
  docs:
    name: Docs build + internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict -d _check/Open-Source-Ai
      - name: Internal links (blocking)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --index-files index.html --root-dir ${{ github.workspace }}/_check --remap 'https://codesbyfebin.github.io/Open-Source-Ai file://${{ github.workspace }}/_check/Open-Source-Ai' --exclude-path _check/Open-Source-Ai/404.html '_check/**/*.html'
          fail: true
  browser:
    name: Browser tests (Playwright, desktop + iPhone 13 emulation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '20'}
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict -d _site/Open-Source-Ai
      - working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium webkit
      - working-directory: tests/browser
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          if-no-files-found: ignore
          path: |
            tests/browser/results.json
            tests/browser/test-results
  recipe-local-chat:
    name: Recipe smoke test – local-chat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate both recipe compose files
        run: |
          docker compose -f recipes/local-chat/docker-compose.yml config --quiet
          docker compose -f recipes/agent-memory-eval/docker-compose.yml config --quiet
      - run: ./recipes/local-chat/smoke.sh
