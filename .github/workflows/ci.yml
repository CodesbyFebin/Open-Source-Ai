name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  catalog:
    name: Catalog integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Schema, duplicates, licences, evidence, no submodules
        run: python scripts/validate.py
      - name: Unit tests (collector, validator, build)
        run: python -m pytest -q tests
      - name: Generated files match catalog (and generation is deterministic)
        run: |
          python scripts/build.py && git diff --exit-code
          python scripts/build.py && git diff --exit-code
  docs:
    name: Docs build + internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict -d _check/Open-Source-Ai-Full-Stack
      - name: Internal links (blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --index-files index.html --root-dir ${{ github.workspace }}/_check --remap 'https://codesbyfebin.github.io/Open-Source-Ai-Full-Stack file://${{ github.workspace }}/_check/Open-Source-Ai-Full-Stack' --exclude-path _check/Open-Source-Ai-Full-Stack/404.html '_check/**/*.html'
          fail: true
  browser:
    name: Browser tests (Playwright, desktop + iPhone 13 emulation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict -d _site/Open-Source-Ai-Full-Stack
      - working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium webkit
      - working-directory: tests/browser
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          if-no-files-found: ignore
          path: |
            tests/browser/results.json
            tests/browser/test-results
  upstream-links:
    name: Upstream links (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --max-concurrency 8 --accept 200,206,429 --exclude localhost --exclude codesbyfebin.github.io README.md CREDITS.md 'docs/**/*.md' 'recipes/**/*.md'
          fail: true
  recipe-local-chat:
    name: Recipe smoke test – local-chat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate both recipe compose files
        run: |
          docker compose -f recipes/local-chat/docker-compose.yml config --quiet
          docker compose -f recipes/agent-memory-eval/docker-compose.yml config --quiet
      - run: ./recipes/local-chat/smoke.sh
