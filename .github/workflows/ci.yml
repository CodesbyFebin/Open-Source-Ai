name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Catalog vs .gitmodules vs gitlinks
        run: python3 scripts/check_catalog.py
      - name: Generated files are up to date
        run: python3 scripts/build.py && git diff --exit-code -- . ':!stacks'
      - name: Compose file is valid
        run: docker compose -f examples/full-stack/docker-compose.yml config --quiet
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept 200,206,429 --exclude 'localhost' --exclude 'codesbyfebin.github.io' README.md CREDITS.md 'docs/**/*.md'
          fail: true
