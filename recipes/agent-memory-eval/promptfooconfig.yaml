description: Agent answers from long-term memory stored in a previous session
prompts: ["{{question}}"]
providers:
  - id: "exec: python agent.py ask"
tests:
  - vars: {question: "Which programming language does the user prefer?"}
    assert:
      - type: icontains
        value: rust
  - vars: {question: "What city does the user live in?"}
    assert:
      - type: icontains
        value: lisbon
