services:
  ollama:
    image: ollama/ollama:0.40.6
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    healthcheck: {test: ["CMD", "ollama", "list"], interval: 10s, retries: 12}
  model-pull:
    image: ollama/ollama:0.40.6
    depends_on: {ollama: {condition: service_healthy}}
    environment: {OLLAMA_HOST: "http://ollama:11434"}
    entrypoint: ["sh", "-c", "ollama pull ${CHAT_MODEL:-qwen2.5:1.5b} && ollama pull ${EMBED_MODEL:-nomic-embed-text:v1.5}"]
    restart: "no"
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]
volumes: {ollama: {}, qdrant: {}}
