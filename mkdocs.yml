site_name: Open Source Ai
site_description: All open-source AI agent and LLM stacks in one repo – gateways, chat UIs, local models, agents, RAG, memory, observability. By CodesbyFebin.
site_author: CodesbyFebin
site_url: https://codesbyfebin.github.io/Open-Source-Ai-Full-Stack/
repo_url: https://github.com/CodesbyFebin/Open-Source-Ai-Full-Stack
repo_name: CodesbyFebin/Open-Source-Ai-Full-Stack
copyright: Copyright &copy; 2026 CodesbyFebin – MIT
theme:
  custom_dir: overrides
  name: material
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  features: [navigation.sections, navigation.top, search.suggest, content.code.copy, navigation.footer]
  palette:
    - scheme: default
      primary: deep purple
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      primary: deep purple
      toggle: {icon: material/brightness-4, name: Light mode}
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CodesbyFebin
plugins: [search]
extra_javascript: [javascripts/a11y.js, javascripts/catalog.js]
extra_css: [stylesheets/extra.css]
markdown_extensions: [attr_list, admonition, tables, toc, pymdownx.superfences, pymdownx.highlight]
nav:
  - Home: index.md
  - Search & Filter: catalog.md
  - Recipes:
      - Overview: recipes/index.md
      - Agent with persistent memory and evaluation: recipes/agent-memory-eval.md
      - Local private chat (model + gateway + chat UI): recipes/local-chat.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Connect to a Gateway: guides/connect-gateway.md
  - Stacks:
      - Gateways & LLM Routing: stacks/gateways-routing.md
      - Chat UIs: stacks/chat-ui.md
      - Local Models & Runtimes: stacks/local-models.md
      - Inference & Serving: stacks/inference-serving.md
      - Memory: stacks/memory.md
      - Agent Frameworks: stacks/agent-frameworks.md
      - Coding Agents: stacks/coding-agents.md
      - Code Review: stacks/code-review.md
      - Low-code App Builders: stacks/app-builders.md
      - RAG & Vector Databases: stacks/rag-vector-db.md
      - Evaluation & Observability: stacks/eval-observability.md
      - Backend & Infra: stacks/backend-infra.md
      - App Templates & Examples: stacks/app-templates.md
      - CodesbyFebin Collection: stacks/codesbyfebin-collection.md
  - Freshness Report: freshness.md
  - Selection Criteria: selection-criteria.md
  - Credits & Licences: credits.md

exclude_docs: |
  wiki/
